[package]
name = "cibi-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui-kit = "0.7.1"
cibi-client = { path = "../cibi-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
