services:
  cibi-api:
    image: ufleck/cibi:latest
    build:
      context: .
      cache_from:
        - ufleck/cibi:latest
    container_name: cibi-api
    ports:
      - "42069:42069"
    volumes:
      - ./data:/data
    environment:
      CIBI_DATABASE_PATH: /data/cibi.db
      CIBI_SERVER_PORT: :42069
      CIBI_SAFETY_BUFFER: 1000
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./internal
        - action: sync
          path: ./web/src
          target: /build/web/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/package-lock.json
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:42069/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  cibi-cli-install:
    build: .
    container_name: cibi-cli-install
    profiles: ["cli"]
    volumes:
      - /usr/local/bin:/install
    entrypoint: ["/bin/sh", "-c", "cp /app/cibi /install/cibi && chmod +x /install/cibi && echo 'cibi CLI installed to /usr/local/bin'"]
    restart: "no"
