services:
  cibi-api:
    image: ufleck/cibi:latest
    build:
      context: .
      cache_from:
        - ufleck/cibi:latest
    container_name: cibi-api
    ports:
      - "42069:42069"
    volumes:
      - ./data:/data
    environment:
      CIBI_DATABASE_PATH: /data/cibi.db
      CIBI_SERVER_PORT: :42069
      CIBI_SAFETY_BUFFER: 1000
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./cmd
        - action: rebuild
          path: ./internal
        - action: rebuild
          path: ./go.mod
        - action: rebuild
          path: ./go.sum
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:42069/api/docs"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
